<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Control Agents Login</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-page">
    <header class="topbar">
      <div class="brand-row">
        <h1>Control Agents</h1>
      </div>
    </header>
    <main class="login-workspace">
      <section class="login-panel" aria-label="Sign in">
        <div class="login-panel-header">
          <h2>Sign in</h2>
        </div>
        <form method="post" action="/login">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="error" required autofocus>
          <button type="submit">Sign in</button>
        </form>
        <p id="error" role="alert" hidden>Invalid password.</p>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
