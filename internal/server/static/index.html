<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Control Agents</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <nav id="tabs" class="tabs" aria-label="Terminal sessions"></nav>
      <div class="topbar-actions">
        <span id="version-badge" class="version-badge" hidden></span>
        <span id="heartbeat" class="heartbeat" data-state="checking" role="status" aria-label="Checking server" title="Checking server"></span>
        <div id="actions-menu" class="actions-menu">
          <button type="button" id="actions-toggle" class="secondary menu-button" aria-controls="actions-popover" aria-expanded="false">Menu</button>
          <div id="actions-popover" class="actions-popover" hidden>
            <button type="button" id="keys-toggle" class="action-menu-item" aria-controls="key-panel" aria-expanded="false">Keys</button>
            <form method="post" action="/logout">
              <button type="submit" class="action-menu-item">Sign out</button>
            </form>
          </div>
        </div>
      </div>
    </header>
    <main class="workspace">
      <section id="terminal-pane" class="terminal-pane">
        <div id="empty-state" class="empty-state">No mirrored terminals are registered.</div>
        <div id="terminal-strip" class="terminal-strip"></div>
        <div id="history-scrollbar" class="history-scrollbar" aria-label="Terminal history scrollbar" hidden>
          <button type="button" id="scroll-top" class="scroll-button" title="History top" aria-label="History top">^</button>
          <div id="history-track" class="history-track" role="scrollbar" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0">
            <div id="history-thumb" class="history-thumb"></div>
          </div>
          <button type="button" id="scroll-bottom" class="scroll-button" title="Live bottom" aria-label="Live bottom">v</button>
        </div>
        <aside id="key-panel" class="key-panel" aria-label="Special keys" hidden>
          <div class="key-panel-header">
            <h2>Special keys</h2>
            <button type="button" id="keys-close" class="key-panel-close" title="Close special keys" aria-label="Close special keys">x</button>
          </div>
          <div id="key-grid" class="key-grid"></div>
        </aside>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
