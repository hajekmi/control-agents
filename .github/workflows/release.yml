name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install tmux 3.7b, ttyd, and browser engines
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bison build-essential iproute2 libevent-dev libncurses-dev pkg-config ttyd util-linux
          sh ./install-tmux.sh
          printf '%s\n' "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"
          test "$(command -v tmux)" = "${HOME}/.local/bin/tmux"
          test "$(tmux -V)" = "tmux 3.7b"

          npx playwright install --with-deps chromium firefox webkit
      - run: make test
      - run: node --check internal/server/static/app.js
      - run: node --check test/playwright/app.spec.js
      - run: make test-e2e
      - run: make test-browser-matrix
      - run: make test-benchmarks

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA::7}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make release-assets VERSION="${version}" COMMIT="${commit}" BUILD_DATE="${build_date}"

          for asset in dist/control-agents-server-linux-amd64 dist/control-agents-linux-amd64; do
            file "${asset}" | grep -q 'x86-64'
          done
          for asset in dist/control-agents-server-linux-arm64 dist/control-agents-linux-arm64; do
            file "${asset}" | grep -q 'ARM aarch64'
          done
          (cd dist && sha256sum -c sha256sums.txt)
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
